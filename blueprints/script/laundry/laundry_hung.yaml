blueprint:
  name: Laundry hung — indoors, outside or nothing (for dashboard buttons)
  description: >-
    One script for every laundry button on a dashboard. Call it with
    `place: Indoors`, `Outside`, `Not hung` or `Change`.

    - **While the laundry is still waiting in the machine:** it sets the
      "Laundry drying place" dropdown, then turns "Laundry waiting" off. The
      Drying-rack reminder takes it from there: the dehumidifier indoors, the
      rain watch outside, or nothing on the rack for *Not hung*.

    - **Once it's on the rack:** *Indoors* / *Outside* changes where it's
      drying. *Change* swaps them.

    - **Anything else** (for example, someone already answered on a phone):
      does nothing.


    It runs one request at a time and checks the state when it runs, so two
    taps can't both count. Give the buttons a `step`, so a late tap can't
    overwrite an answer that already arrived from a phone:

    - `step: hung` for the "Hung …" buttons: counts only while the laundry is
      still waiting;

    - `step: move` for the buttons shown while it's on the rack (Indoors /
      Outside / Change): counts only once it's on the rack.

    Without `step`, it works as before (whichever applies).
  domain: script
  source_url: https://github.com/davidteles/ha-blueprints/blob/main/blueprints/script/laundry/laundry_hung.yaml
  input:
    waiting:
      name: '"Laundry waiting" toggle'
      selector: { entity: { domain: input_boolean } }
    on_rack:
      name: '"Laundry on the drying rack" toggle'
      selector: { entity: { domain: input_boolean } }
    place:
      name: '"Laundry drying place" dropdown'
      selector: { entity: { domain: input_select } }
    indoor_option:
      name: Dropdown option meaning indoors
      default: Indoors
      selector: { text: {} }
    outside_option:
      name: Dropdown option meaning outside
      default: Outside
      selector: { text: {} }
    not_hung_option:
      name: Dropdown option meaning "nothing hung"
      default: Not hung
      selector: { text: {} }

mode: queued
max: 10
icon: mdi:hanger

fields:
  place:
    name: Place
    required: true
    selector: { select: { options: [Indoors, Outside, Not hung, Change] } }
  step:
    name: Step (recommended)
    description: hung = answering where it was hung; move = changing where it's drying. Leave empty for either.
    required: false
    selector: { select: { options: [hung, move] } }

variables:
  waiting_entity: !input waiting
  rack_entity: !input on_rack
  place_entity: !input place
  indoor: !input indoor_option
  outside: !input outside_option
  not_hung: !input not_hung_option
  step_now: "{{ step | default('') }}"
  wanted: >-
    {{ {'Indoors': indoor, 'Outside': outside, 'Not hung': not_hung}.get(place, place) }}

sequence:
  - choose:
      - alias: Still waiting in the machine → this is the answer
        conditions:
          - condition: template
            value_template: "{{ step_now in ['', 'hung'] and is_state(waiting_entity, 'on') and place in ['Indoors', 'Outside', 'Not hung'] }}"
        sequence:
          - action: input_select.select_option
            target: { entity_id: "{{ place_entity }}" }
            data: { option: "{{ wanted }}" }
          - action: input_boolean.turn_off
            target: { entity_id: "{{ waiting_entity }}" }
      - alias: Already on the rack → change where it's drying
        conditions:
          - condition: template
            value_template: "{{ step_now in ['', 'move'] and is_state(rack_entity, 'on') and place in ['Indoors', 'Outside', 'Change'] }}"
        sequence:
          - action: input_select.select_option
            target: { entity_id: "{{ place_entity }}" }
            data:
              option: >-
                {{ (outside if is_state(place_entity, indoor) else indoor) if place == 'Change' else wanted }}
