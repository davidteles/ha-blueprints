blueprint:
  name: Laundry done — stays "waiting" until it's emptied
  description: >-
    When the washer (or dryer) finishes, a "laundry waiting" toggle turns on and
    one notification is sent with **Remind me later** and **Done** buttons.
    The toggle stays on until someone empties the machine, so a dashboard can
    keep showing it even after the machine powers itself off.


    It clears itself when you press **Done**, when the next cycle starts, when
    the machine is switched on again (someone is at it), or when you turn the
    toggle off from a dashboard — and the phone notification disappears too.


    **Optional — where did you hang it?** Pick the "Laundry drying place"
    dropdown (the one the Drying-rack reminder uses). The notification then
    asks **Hung indoors / Hung outside / Nothing to hang**, with the drying
    advice in the title if you also pick the "Laundry drying advice" text.
    Each wash gets its own button IDs, so a button from an older notification
    can't change the next load. When the step just before "finished" was a
    drying step (a washer-dryer), it says the laundry is dry and offers
    **Taken out** instead.


    **Create first:** a Toggle helper, e.g. "Laundry waiting". Recommended: a
    Date and time helper, "Washer finished at", so "done since …" stays right
    after a restart (Home Assistant resets a toggle's "last changed" time when
    it restarts). A dashboard can show it too.
  domain: automation
  source_url: https://github.com/davidteles/ha-blueprints/blob/main/blueprints/automation/laundry/laundry_done_until_emptied.yaml
  input:
    machine_state:
      name: Machine state sensor
      description: The sensor that says what the machine is doing (e.g. the washer's job state).
      selector: { entity: { domain: sensor } }
    finished_states:
      name: '"Finished" states'
      description: State(s) of that sensor meaning the cycle has finished, separated by commas.
      default: finish
      selector: { text: {} }
    running_states:
      name: '"New cycle" states'
      description: State(s) meaning a new cycle has started, separated by commas.
      default: weight_sensing, pre_wash, wash, ai_wash, delay_wash
      selector: { text: {} }
    power:
      name: Power sensor (optional)
      description: Turns on when someone switches the machine on. Leave empty if you don't have one.
      default: []
      selector: { entity: { domain: binary_sensor } }
    waiting:
      name: '"Laundry waiting" toggle'
      selector: { entity: { domain: input_boolean } }
    finished_at:
      name: '"Finished at" date and time helper (optional, recommended)'
      description: Keeps the "done since" time right through Home Assistant restarts.
      default: []
      selector: { entity: { domain: input_datetime } }
    notify_action:
      name: Notification action
      description: e.g. notify.mobile_app_your_phone, or a notify group to reach several phones.
      default: notify.notify
      selector: { text: {} }
    snooze:
      name: Remind me again after
      default: { minutes: 30 }
      selector: { duration: {} }
    title:
      name: Title
      default: "🧺 Washing done"
      selector: { text: {} }
    choice_section:
      name: Where did you hang it? (optional)
      icon: mdi:hanger
      collapsed: true
      input:
        place:
          name: '"Laundry drying place" dropdown'
          description: Turns the notification buttons into Hung indoors / Hung outside / Nothing to hang. Needs the "Finished at" helper above.
          default: []
          selector: { entity: { domain: input_select } }
        indoor_option:
          name: Dropdown option meaning indoors
          default: Indoors
          selector: { text: {} }
        outside_option:
          name: Dropdown option meaning outside
          default: Outside
          selector: { text: {} }
        not_hung_option:
          name: Dropdown option meaning "nothing hung"
          default: Not hung
          selector: { text: {} }
        advice:
          name: '"Laundry drying advice" text (optional)'
          description: From the "Laundry drying advice" blueprint. Its recommendation goes into the title.
          default: []
          selector: { entity: { domain: input_text } }
        drying_states:
          name: '"Came out dry" states'
          description: If the machine was in one of these just before finishing (a washer-dryer), the laundry is dry.
          default: drying, cooling, wrinkle_prevent
          selector: { text: {} }

mode: parallel
max: 10

variables:
  machine_entity: !input machine_state
  finished_input: !input finished_states
  running_input: !input running_states
  finished_list: "{{ finished_input.split(',') | map('trim') | reject('eq', '') | list }}"
  running_list: "{{ running_input.split(',') | map('trim') | reject('eq', '') | list }}"
  waiting_entity: !input waiting
  finished_entity: !input finished_at
  has_finished: "{{ finished_entity not in ['', none, []] }}"
  notify_action: !input notify_action
  snooze_input: !input snooze
  title: !input title
  buttons:
    - action: LAUNDRY_SNOOZE
      title: Remind me later
    - action: LAUNDRY_DONE
      title: Done
  place_entity: !input place
  indoor: !input indoor_option
  outside: !input outside_option
  not_hung: !input not_hung_option
  advice_entity: !input advice
  has_advice: "{{ advice_entity not in ['', none, []] }}"
  drying_input: !input drying_states
  drying_list: "{{ drying_input.split(',') | map('trim') | reject('eq', '') | list }}"
  choice_mode: "{{ place_entity not in ['', none, []] and has_finished }}"

triggers:
  - trigger: state
    entity_id: !input machine_state
    not_from: [unavailable, unknown]
    id: machine
  - trigger: state
    entity_id: !input power
    from: ["off", unavailable]
    to: "on"
    id: powered_on
  - trigger: event
    event_type: mobile_app_notification_action
    event_data: { action: LAUNDRY_DONE }
    id: done
  - trigger: event
    event_type: mobile_app_notification_action
    event_data: { action: LAUNDRY_SNOOZE }
    id: snooze
  - trigger: state
    entity_id: !input waiting
    from: "on"
    to: "off"
    id: cleared_elsewhere
  - trigger: event
    event_type: mobile_app_notification_action
    id: choice

conditions:
  - alias: Of all phone buttons, only this blueprint's choice buttons
    condition: template
    value_template: >-
      {{ trigger.id != 'choice' or (trigger.event.data.action | default('')).startswith(('LAUNDRY_HUNG_', 'LAUNDRY_NONE_')) }}

actions:
  - choose:
      - alias: Cycle finished
        conditions:
          - condition: trigger
            id: machine
          - condition: template
            value_template: "{{ trigger.to_state.state in finished_list }}"
        sequence:
          - action: input_boolean.turn_on
            target: { entity_id: "{{ waiting_entity }}" }
          - if:
              - condition: template
                value_template: "{{ has_finished }}"
            then:
              - action: input_datetime.set_datetime
                target: { entity_id: "{{ finished_entity }}" }
                data: { timestamp: "{{ now().timestamp() }}" }
          - if:
              - condition: template
                value_template: "{{ choice_mode and has_advice }}"
            then:
              - alias: Ask for fresh drying advice, wait a moment for it
                event: laundry_advice_refresh
              - wait_for_trigger:
                  - trigger: state
                    entity_id: !input advice
                timeout: { seconds: 10 }
          - variables:
              load: "{{ state_attr(finished_entity, 'timestamp') | int(0) if has_finished else 0 }}"
              dried: "{{ trigger.from_state.state in drying_list }}"
              adv: "{{ ((states(advice_entity) if has_advice else '') ~ '||||').split('|') }}"
              rec: "{{ adv[0] if adv[0] in ['indoors', 'outdoors'] else '' }}"
              choice_buttons: >-
                {% if dried %}{{ [{'action': 'LAUNDRY_NONE_' ~ load, 'title': 'Taken out'}] }}
                {% else %}{{ [{'action': 'LAUNDRY_HUNG_INDOORS_' ~ load, 'title': 'Hung indoors' ~ (' (recommended)' if rec == 'indoors' else '')},
                              {'action': 'LAUNDRY_HUNG_OUTSIDE_' ~ load, 'title': 'Hung outside' ~ (' (recommended)' if rec == 'outdoors' else '')},
                              {'action': 'LAUNDRY_NONE_' ~ load, 'title': 'Nothing to hang'}] }}{% endif %}
          - if:
              - condition: template
                value_template: "{{ choice_mode }}"
            then:
              - action: "{{ notify_action }}"
                data:
                  title: >-
                    {% if dried %}✅ Wash and dry done{% else %}{{ title }}{{ {'outdoors': ' · Outside recommended', 'indoors': ' · Indoors recommended'}.get(rec, '') }}{% endif %}
                  message: >-
                    {% if dried %}Finished at {{ now().strftime('%H:%M') }} — the laundry is dry, take it out.
                    👆 Press and hold for: Taken out{% else %}Finished at {{ now().strftime('%H:%M') }}. {{ adv[1] if adv[1] else 'No recommendation' }}. Choose once it's on the rack.
                    👆 Press and hold for: Hung indoors · Hung outside · Nothing to hang{% endif %}
                  data: { tag: laundry, group: laundry, actions: "{{ choice_buttons }}" }
            else:
              - action: "{{ notify_action }}"
                data:
                  title: "{{ title }}"
                  message: "Finished at {{ now().strftime('%H:%M') }} — time to empty it.\n👆 Press and hold for: Remind me later · Done"
                  data: { tag: laundry, group: laundry, actions: "{{ buttons }}" }
      - alias: Remind me later
        conditions:
          - condition: trigger
            id: snooze
        sequence:
          - delay: "{{ snooze_input }}"
          - condition: template
            value_template: "{{ is_state(waiting_entity, 'on') }}"
          - variables:
              since: >-
                {% set ts = state_attr(finished_entity, 'timestamp') if has_finished else none %}
                {{ (ts | as_datetime if ts else states[waiting_entity].last_changed) | as_local }}
          - action: "{{ notify_action }}"
            data:
              title: "{{ title }} — still waiting"
              message: "Done since {{ as_datetime(since).strftime('%H:%M') }}.\n👆 Press and hold for: Remind me later · Done"
              data: { tag: laundry, group: laundry, actions: "{{ buttons }}" }
      - alias: Emptied, or a new cycle / power-on means someone is at the machine
        conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: [done, powered_on]
              - condition: and
                conditions:
                  - condition: trigger
                    id: machine
                  - condition: template
                    value_template: "{{ trigger.to_state.state in running_list }}"
          - condition: template
            value_template: "{{ is_state(waiting_entity, 'on') }}"
        sequence:
          - action: input_boolean.turn_off
            target: { entity_id: "{{ waiting_entity }}" }
      - alias: Hung indoors / outside / nothing → set the dropdown, laundry no longer waiting
        conditions:
          - condition: trigger
            id: choice
          - condition: template
            alias: This load (not an older notification), still waiting
            value_template: >-
              {{ choice_mode and is_state(waiting_entity, 'on')
                 and trigger.event.data.action.split('_')[-1] == (state_attr(finished_entity, 'timestamp') | int(0)) | string }}
        sequence:
          - variables:
              a: "{{ trigger.event.data.action }}"
          - action: input_select.select_option
            target: { entity_id: "{{ place_entity }}" }
            data:
              option: "{{ indoor if a.startswith('LAUNDRY_HUNG_INDOORS_') else outside if a.startswith('LAUNDRY_HUNG_OUTSIDE_') else not_hung }}"
          - action: input_boolean.turn_off
            target: { entity_id: "{{ waiting_entity }}" }
      - alias: Toggle turned off anywhere → remove the phone notification
        conditions:
          - condition: trigger
            id: cleared_elsewhere
        sequence:
          - action: "{{ notify_action }}"
            continue_on_error: true
            data:
              message: clear_notification
              data: { tag: laundry }
