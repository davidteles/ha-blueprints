blueprint:
  name: Drying-rack reminder (indoors or outside, with rain warning)
  description: >-
    Once the laundry is out of the machine and on the drying rack, remind
    someone to put it away: the same evening if it was hung in the morning,
    otherwise the next evening. The notification has a **Put away** button.


    Works together with "Laundry done — stays waiting until it's emptied": when
    its "laundry waiting" toggle turns off, the laundry is on the rack.


    **Optional — indoors or outside:** add a Dropdown "Laundry drying place"
    with the options *Not set*, *Indoors*, *Outside* and *Not hung*. A person
    chooses with the "Laundry done" buttons, the "Laundry hung" script or a
    dashboard. A recommendation (see "Laundry drying advice") never sets it.
    If the laundry is taken out without a choice, by default nothing is
    switched on: the phones at home are asked **Indoors / Outside**, and
    *Indoors* starts the dehumidifier once someone confirms. *Not hung* (a
    drum clean, or a washer-dryer that dried it) puts nothing on the rack.

    - **Indoors:** a dehumidifier (or fan, or plug) is switched on if it was
      off. Its mode is left alone.

    - **Outside:** while it dries, the rain gauge and the hourly forecast are
      checked every 5 minutes. If it's raining, or rain is due within 30
      minutes, the phones that are at home get one time-sensitive warning
      with an **It's indoors** button. That button switches to indoors.
      If nobody is home, every phone gets it. A "rain alert" toggle stays on
      meanwhile, so a dashboard can show it.
      A failed or empty forecast is not an all-clear: the warning stays until
      a real forecast is dry (or 3 hours pass with no forecast at all).


    **One rack, one load at a time:** every button carries the load it was sent
    for, so an old notification (yesterday's *Put away*, an earlier *Outside*)
    can't act on the laundry drying now. Add the "Hung at" helper for this to be
    exact; without it, two loads hung on the same day share their buttons. If a
    second load finishes while the first is still drying and you pick *Not
    hung*, the first load keeps its place and its rain watch.


    **Create first:** a Toggle "Laundry on the drying rack" and a Date and time
    helper "Drying-rack reminder at" (both date and time). The date/time helper
    keeps the reminder through restarts. Recommended: a second Date and time
    helper, "Laundry hung at", so "drying since …" stays right after a restart
    (Home Assistant resets a toggle's "last changed" time when it restarts).
  domain: automation
  source_url: https://github.com/davidteles/ha-blueprints/blob/main/blueprints/automation/laundry/drying_rack_reminder.yaml
  input:
    waiting:
      name: '"Laundry waiting" toggle'
      description: When this turns off, the laundry is on the rack.
      selector: { entity: { domain: input_boolean } }
    on_rack:
      name: '"Laundry on the drying rack" toggle'
      selector: { entity: { domain: input_boolean } }
    reminder_at:
      name: '"Drying-rack reminder at" date and time helper'
      selector: { entity: { domain: input_datetime } }
    hung_at:
      name: '"Laundry hung at" date and time helper (optional, recommended)'
      description: Keeps the "drying since" time right through Home Assistant restarts.
      default: []
      selector: { entity: { domain: input_datetime } }
    reminder_time:
      name: Reminder time
      default: "20:00:00"
      selector: { time: {} }
    same_day_before:
      name: Same-day reminder if hung before
      description: Hung before this hour → reminder the same day; later → the next day.
      default: 12
      selector: { number: { min: 0, max: 23, unit_of_measurement: h } }
    notify_action:
      name: Notification action
      description: e.g. notify.mobile_app_your_phone, or a notify group. Used for everything when no phones are picked below.
      default: notify.notify
      selector: { text: {} }
    place_section:
      name: Indoors or outside (optional)
      icon: mdi:weather-partly-rainy
      collapsed: true
      input:
        place:
          name: '"Laundry drying place" dropdown'
          description: >-
            Options *Not set*, *Indoors*, *Outside* (the first one is what it goes back
            to after the laundry is put away). Leave empty to skip all of this.
          default: []
          selector: { entity: { domain: input_select } }
        indoor_option:
          name: Dropdown option meaning indoors
          default: Indoors
          selector: { text: {} }
        outside_option:
          name: Dropdown option meaning outside
          default: Outside
          selector: { text: {} }
        not_hung_option:
          name: Dropdown option meaning "nothing hung"
          description: Machine care, or the laundry came out dry. Nothing goes on the rack.
          default: Not hung
          selector: { text: {} }
        no_choice:
          name: Taken out without a choice
          description: >-
            Wait for a person (nothing is switched on until someone chooses), or count
            it as indoors straight away (how v1.9.0 worked).
          default: wait
          selector:
            select:
              options:
                - { value: wait, label: Wait for a person }
                - { value: indoors, label: Count it as indoors }
        dehumidifier:
          name: Switch on when it's indoors (optional)
          description: A dehumidifier, fan or plug. It's only switched on if it's off; its mode is not changed.
          default: []
          selector: { entity: { domain: [humidifier, fan, switch] } }
        rain_alert:
          name: '"Laundry rain alert" toggle'
          description: Needed for the rain warning. It's on while rain is coming and the laundry is outside — handy for a dashboard card.
          default: []
          selector: { entity: { domain: input_boolean } }
        rain_sensor:
          name: Rain sensor (optional)
          description: >-
            A rain gauge's current rate (raining when above 0) or a binary rain sensor
            (raining when on). Not a daily or hourly total: a total stays above 0 long
            after the rain stops.
          default: []
          selector: { entity: { domain: [sensor, binary_sensor] } }
        weather:
          name: Weather forecast (optional)
          description: Its hourly forecast is used to warn before the rain starts.
          default: []
          selector: { entity: { domain: weather } }
        warn_minutes:
          name: Warn this long before forecast rain
          default: 30
          selector: { number: { min: 5, max: 120, step: 5, unit_of_measurement: min } }
        phones:
          name: Phones (optional)
          description: >-
            Companion-app phones. The rain warning and the "where is it drying?"
            question go to the ones that are at home (all of them if nobody is). Without
            phones, the notification action above is used.
          default: []
          selector: { device: { integration: mobile_app, multiple: true } }

mode: queued
max: 10

variables:
  on_rack_entity: !input on_rack
  waiting_entity: !input waiting
  reminder_entity: !input reminder_at
  hung_entity: !input hung_at
  has_hung: "{{ hung_entity not in ['', none, []] }}"
  reminder_time: !input reminder_time
  cutoff: !input same_day_before
  notify_action: !input notify_action
  place_entity: !input place
  has_place: "{{ place_entity not in ['', none, []] }}"
  indoor: !input indoor_option
  outside: !input outside_option
  not_hung: !input not_hung_option
  no_choice: !input no_choice
  dehumidifier: !input dehumidifier
  alert_entity: !input rain_alert
  has_alert: "{{ alert_entity not in ['', none, []] }}"
  rain_sensor: !input rain_sensor
  weather_entity: !input weather
  warn_minutes: !input warn_minutes
  phones: !input phones
  phone_list: "{{ [phones] if phones is string and phones else (phones if phones is iterable and phones is not string else []) }}"
  all_targets: >-
    {{ phone_list | map('device_attr', 'name') | reject('none') | map('slugify')
       | map('regex_replace', '^', 'notify.mobile_app_') | list or [notify_action] }}
  home_targets: >-
    {% set ns = namespace(l=[]) %}
    {% for d in phone_list %}
      {% set t = device_entities(d) | select('match', 'device_tracker[.]') | list %}
      {% if t and is_state(t[0], 'home') and device_attr(d, 'name') %}
        {% set ns.l = ns.l + ['notify.mobile_app_' ~ (device_attr(d, 'name') | slugify)] %}
      {% endif %}
    {% endfor %}
    {{ ns.l or all_targets }}
  place_now: "{{ states(place_entity) if has_place else '' }}"
  # Every button carries the load it belongs to (the "hung at" time, or the reminder
  # time without that helper), so an old notification can't act on the next load.
  episode: >-
    {% set ts = state_attr(hung_entity, 'timestamp') if has_hung else state_attr(reminder_entity, 'timestamp') %}
    {{ ts | int(0) }}
  btn: "{{ ('_' ~ episode) if episode | int(0) > 0 else '' }}"
  tid: >-
    {%- if trigger.id != 'phone' -%}{{ trigger.id }}
    {%- else -%}
      {%- set a = trigger.event.data.action | default('') -%}
      {%- set ns = namespace(t='ignore') -%}
      {%- for k, v in [('LAUNDRY_RACK_DONE', 'put_away'), ('LAUNDRY_INDOORS', 'say_indoors'),
                       ('LAUNDRY_BROUGHT_IN', 'say_indoors'), ('LAUNDRY_OUTSIDE', 'say_outside')] -%}
        {%- if a == k ~ btn -%}{%- set ns.t = v -%}{%- endif -%}
      {%- endfor -%}{{ ns.t }}
    {%- endif -%}

conditions:
  - alias: Phone buttons from another notification, or from an earlier load, are ignored
    condition: template
    value_template: "{{ tid != 'ignore' }}"
  - alias: The 5-minute rain check only runs while laundry is outside
    condition: template
    value_template: >-
      {{ tid != 'rain_check' or (has_place and has_alert and is_state(place_entity, outside)
         and is_state(on_rack_entity, 'on')) }}

triggers:
  - trigger: state
    entity_id: !input waiting
    from: "on"
    to: "off"
    id: hung
  - trigger: state
    entity_id: !input waiting
    from: "off"
    to: "on"
    id: new_load
  - trigger: time
    at: !input reminder_at
    id: due
  - alias: A phone button (checked below against the load on the rack now)
    trigger: event
    event_type: mobile_app_notification_action
    id: phone
  - trigger: state
    entity_id: !input on_rack
    from: "on"
    to: "off"
    id: put_away
  - trigger: state
    entity_id: !input place
    not_from: [unavailable, unknown]
    id: place_changed
  - trigger: time_pattern
    minutes: /5
    id: rain_check
  - trigger: state
    entity_id: !input rain_sensor
    id: rain_check

actions:
  - choose:
      - alias: Taken out but not hung (machine care, or it came out dry) → nothing on the rack
        conditions:
          - condition: template
            value_template: "{{ tid == 'hung' and has_place and is_state(place_entity, not_hung) }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_state(on_rack_entity, 'on') }}"
            then:
              - stop: An earlier load is still on the rack; its place is put back separately
          - variables:
              first: "{{ (state_attr(place_entity, 'options') or [''])[0] }}"
          - if:
              - condition: template
                value_template: "{{ first not in ['', indoor, outside, not_hung] }}"
            then:
              - action: input_select.select_option
                target: { entity_id: "{{ place_entity }}" }
                data: { option: "{{ first }}" }
      - alias: New wash done, rack empty → the next place isn't chosen yet
        conditions:
          - condition: template
            value_template: "{{ tid == 'new_load' }}"
          - condition: template
            value_template: "{{ has_place and is_state(on_rack_entity, 'off') }}"
        sequence:
          - variables:
              first: "{{ (state_attr(place_entity, 'options') or [''])[0] }}"
          - if:
              - condition: template
                value_template: "{{ first not in ['', indoor, outside, not_hung] }}"
            then:
              - action: input_select.select_option
                target: { entity_id: "{{ place_entity }}" }
                data: { option: "{{ first }}" }
      - alias: >-
          "Not hung" for a new load while an earlier one is on the rack: its place was
          put back after "waiting" turned off, so nothing new was hung
        conditions:
          - condition: template
            value_template: >-
              {{ tid == 'hung' and has_place and is_state(on_rack_entity, 'on')
                 and states[place_entity].last_changed > trigger.to_state.last_changed }}
        sequence:
          - stop: Nothing new on the rack
      - alias: >-
          "Not hung" picked while an earlier load is on the rack → keep that load's place
          (one rack: the place belongs to the laundry already drying)
        conditions:
          - condition: template
            value_template: >-
              {{ tid == 'place_changed' and has_place and trigger.to_state.state == not_hung
                 and is_state(on_rack_entity, 'on') and trigger.from_state.state in [indoor, outside] }}
        sequence:
          - wait_template: "{{ is_state(waiting_entity, 'off') }}"
            timeout: { seconds: 30 }
          - action: input_select.select_option
            target: { entity_id: "{{ place_entity }}" }
            data: { option: "{{ trigger.from_state.state }}" }
          - stop: Earlier load's place kept
      - alias: Laundry hung → schedule the reminder
        conditions: [{ condition: template, value_template: "{{ tid == 'hung' }}" }]
        sequence:
          - action: input_boolean.turn_on
            target: { entity_id: "{{ on_rack_entity }}" }
          - if:
              - condition: template
                value_template: "{{ has_hung }}"
            then:
              - action: input_datetime.set_datetime
                target: { entity_id: "{{ hung_entity }}" }
                data: { timestamp: "{{ now().timestamp() }}" }
          - action: input_datetime.set_datetime
            target: { entity_id: "{{ reminder_entity }}" }
            data:
              datetime: >-
                {% set at = today_at(reminder_time) %}
                {{ (at if now().hour < cutoff | int else at + timedelta(days=1)).strftime('%Y-%m-%d %H:%M:%S') }}
          - variables:
              episode_now: >-
                {% set ts = state_attr(hung_entity, 'timestamp') if has_hung else state_attr(reminder_entity, 'timestamp') %}
                {{ ts | int(0) }}
              place_buttons:
                - { action: "LAUNDRY_INDOORS{{ ('_' ~ episode_now) if episode_now | int(0) > 0 else '' }}", title: Indoors }
                - { action: "LAUNDRY_OUTSIDE{{ ('_' ~ episode_now) if episode_now | int(0) > 0 else '' }}", title: Outside }
          - if:
              - condition: template
                value_template: "{{ has_place and place_now not in [indoor, outside] }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ no_choice == 'indoors' }}"
                then:
                  - alias: Count it as indoors straight away (v1.9.0 behaviour)
                    action: input_select.select_option
                    target: { entity_id: "{{ place_entity }}" }
                    data: { option: "{{ indoor }}" }
                    continue_on_error: true
              - repeat:
                  for_each: "{{ home_targets }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        title: "👕 Laundry hung — where is it drying?"
                        message: >-
                          {% if no_choice == 'indoors' %}Counted as indoors{{ ', so the dehumidifier is on' if dehumidifier not in ['', none, []] else '' }}.
                          If it's outside, you'll be warned when rain is coming.{% else %}Choose so the right thing happens:
                          indoors {{ 'switches the dehumidifier on' if dehumidifier not in ['', none, []] else 'is noted' }}, outside watches for rain.{% endif %}
                          👆 Press and hold for: Indoors · Outside
                        data: { tag: laundry-place, group: laundry, actions: "{{ place_buttons }}" }
      - alias: Reminder time
        conditions:
          - condition: template
            value_template: "{{ tid == 'due' }}"
          - condition: template
            value_template: "{{ is_state(on_rack_entity, 'on') }}"
        sequence:
          - variables:
              since: >-
                {% set ts = state_attr(hung_entity, 'timestamp') if has_hung else none %}
                {{ (ts | as_datetime if ts else states[on_rack_entity].last_changed) | as_local }}
          - action: "{{ notify_action }}"
            data:
              title: "👕 Laundry on the drying rack"
              message: >-
                Drying{{ ' outside' if has_place and place_now == outside else '' }} since {{ as_datetime(since).strftime('%a %H:%M') }} — time to put it away.
                👆 Press and hold for: Put away
              data:
                tag: laundry-rack
                group: laundry
                actions: [{ action: "LAUNDRY_RACK_DONE{{ btn }}", title: Put away }]
      - alias: Put away (phone button, or the toggle turned off)
        conditions: [{ condition: template, value_template: "{{ tid == 'put_away' }}" }]
        sequence:
          - action: input_boolean.turn_off
            target: { entity_id: "{{ on_rack_entity }}" }
          - action: "{{ notify_action }}"
            continue_on_error: true
            data:
              message: clear_notification
              data: { tag: laundry-rack }
          - if:
              - condition: template
                value_template: "{{ has_alert and is_state(alert_entity, 'on') }}"
            then:
              - action: input_boolean.turn_off
                target: { entity_id: "{{ alert_entity }}" }
          - if:
              - condition: template
                value_template: "{{ has_place and is_state(waiting_entity, 'off') }}"
            then:
              - alias: Back to the first option ("Not set") for the next wash
                variables:
                  first: "{{ (state_attr(place_entity, 'options') or [''])[0] }}"
              - if:
                  - condition: template
                    value_template: "{{ first not in ['', indoor, outside] }}"
                then:
                  - action: input_select.select_option
                    target: { entity_id: "{{ place_entity }}" }
                    data: { option: "{{ first }}" }
          - repeat:
              for_each: "{{ all_targets }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data: { message: clear_notification, data: { tag: laundry-rain } }
      - alias: Phone answer → set the dropdown
        conditions:
          - condition: template
            value_template: "{{ tid in ['say_indoors', 'say_outside'] }}"
          - condition: template
            value_template: "{{ has_place }}"
        sequence:
          - action: input_select.select_option
            target: { entity_id: "{{ place_entity }}" }
            data: { option: "{{ indoor if tid == 'say_indoors' else outside }}" }
          - repeat:
              for_each: "{{ all_targets }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data: { message: clear_notification, data: { tag: laundry-place } }

  - alias: Indoors while on the rack → dehumidifier on, rain alert off
    if:
      - condition: template
        value_template: >-
          {{ has_place and is_state(on_rack_entity, 'on') and is_state(place_entity, indoor)
             and ((tid == 'hung' and place_now == indoor)
                  or (tid == 'place_changed' and trigger.from_state.state != indoor)) }}
    then:
      - if:
          - condition: template
            value_template: "{{ dehumidifier not in ['', none, []] and is_state(dehumidifier, 'off') }}"
        then:
          - action: homeassistant.turn_on
            target: { entity_id: "{{ dehumidifier }}" }
      - if:
          - condition: template
            value_template: "{{ has_alert and is_state(alert_entity, 'on') }}"
        then:
          - action: input_boolean.turn_off
            target: { entity_id: "{{ alert_entity }}" }
          - repeat:
              for_each: "{{ all_targets }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data: { message: clear_notification, data: { tag: laundry-rain } }

  - alias: Outside → rain watch
    if:
      - condition: template
        value_template: >-
          {{ has_place and has_alert and is_state(place_entity, outside) and is_state(on_rack_entity, 'on')
             and tid in ['hung', 'rain_check', 'place_changed']
             and (rain_sensor not in ['', none, []] or weather_entity not in ['', none, []]) }}
    then:
      - variables:
          raining: >-
            {% if rain_sensor in ['', none, []] %}false
            {% elif rain_sensor.startswith('binary_sensor.') %}{{ is_state(rain_sensor, 'on') }}
            {% else %}{{ states(rain_sensor) | float(0) > 0 }}{% endif %}
          fc: {}
      - if:
          - condition: template
            value_template: "{{ weather_entity not in ['', none, []] }}"
        then:
          - action: weather.get_forecasts
            target: { entity_id: "{{ weather_entity }}" }
            data: { type: hourly }
            response_variable: fc
            continue_on_error: true
      - variables:
          rain_at: >-
            {%- set ns = namespace(t='') -%}
            {%- for f in (fc[weather_entity].forecast if fc and weather_entity in fc else []) if not ns.t -%}
              {%- set dt = as_local(as_datetime(f.datetime)) -%}
              {%- if dt <= now() + timedelta(minutes=warn_minutes | int) and dt + timedelta(hours=1) > now()
                    and (f.condition in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']
                         or (f.precipitation_probability | default(0) | float(0)) >= 60
                         or (f.precipitation | default(0) | float(0)) >= 0.2) -%}
                {%- set ns.t = 'now' if dt <= now() else dt.strftime('%H:%M') -%}
              {%- endif -%}
            {%- endfor -%}{{ ns.t }}
          when: "{{ 'now' if raining or rain_at == 'now' else 'around ' ~ rain_at }}"
          have_forecast: >-
            {{ weather_entity in ['', none, []]
               or (fc and weather_entity in fc and (fc[weather_entity].forecast | default([]) | count) > 0) }}
          warning_expired: >-
            {{ has_alert and is_state(alert_entity, 'on')
               and (now() - states[alert_entity].last_changed).total_seconds() > 3 * 3600 }}
      - choose:
          - alias: Rain now or soon → warn the phones at home, once
            conditions:
              - condition: template
                value_template: "{{ (raining or rain_at != '') and is_state(alert_entity, 'off') }}"
            sequence:
              - action: input_boolean.turn_on
                target: { entity_id: "{{ alert_entity }}" }
              - repeat:
                  for_each: "{{ home_targets }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        title: "☔ Rain {{ when }} — the laundry is outside"
                        message: >-
                          Bring it in, then tap It's indoors.
                          👆 Press and hold for: It's indoors
                        data:
                          tag: laundry-rain
                          group: laundry
                          push: { interruption-level: time-sensitive }
                          actions: [{ action: "LAUNDRY_BROUGHT_IN{{ btn }}", title: "It's indoors" }]
          - alias: >-
              Dry again and a real forecast with no rain → stand down. A failed or empty
              forecast is not an all-clear; such a warning expires after 3 hours.
            conditions:
              - condition: template
                value_template: >-
                  {{ not raining and rain_at == '' and is_state(alert_entity, 'on')
                     and (have_forecast or warning_expired) }}
            sequence:
              - action: input_boolean.turn_off
                target: { entity_id: "{{ alert_entity }}" }
              - repeat:
                  for_each: "{{ all_targets }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      continue_on_error: true
                      data: { message: clear_notification, data: { tag: laundry-rain } }
