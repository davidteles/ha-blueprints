blueprint:
  name: '"Close the windows" — to keep the warmth in, or the cold out'
  description: >-
    Two friendly reminders while someone is home:


    - **Too warm:** it is already warm inside and now warmer outside than in —
      close the windows to stop the heat coming in.

    - **Too cold:** it is already cool inside and colder outside than in —
      close the windows to keep the warmth.
  domain: automation
  source_url: https://github.com/davidteles/ha-blueprints/blob/main/blueprints/automation/comfort/close_windows_reminder.yaml
  input:
    outdoor:
      name: Outdoor temperature
      selector: { entity: { domain: sensor, device_class: temperature } }
    indoor:
      name: Indoor temperature
      selector: { entity: { domain: sensor, device_class: temperature } }
    warm:
      name: '"Too warm" when inside is above'
      default: 22
      selector: { number: { min: 15, max: 35, step: 0.5, unit_of_measurement: "°C" } }
    cold:
      name: '"Too cold" when inside is below'
      default: 19
      selector: { number: { min: 10, max: 25, step: 0.5, unit_of_measurement: "°C" } }
    wait:
      name: For at least
      default: { minutes: 5 }
      selector: { duration: {} }
    home_zone:
      name: Home zone
      default: zone.home
      selector: { entity: { domain: zone } }
    notify_action:
      name: Notification action
      default: notify.notify
      selector: { text: {} }

mode: single

trigger_variables:
  outdoor: !input outdoor
  indoor: !input indoor
  warm: !input warm
  cold: !input cold

variables:
  notify_action: !input notify_action

triggers:
  - trigger: template
    value_template: >-
      {% set o = states(outdoor) | float(none) %}{% set i = states(indoor) | float(none) %}
      {{ o is not none and i is not none and o > i and i > warm | float }}
    for: !input wait
    id: warm
  - trigger: template
    value_template: >-
      {% set o = states(outdoor) | float(none) %}{% set i = states(indoor) | float(none) %}
      {{ o is not none and i is not none and o < i and i < cold | float }}
    for: !input wait
    id: cold

conditions:
  - condition: numeric_state
    entity_id: !input home_zone
    above: 0

actions:
  - action: "{{ notify_action }}"
    data:
      title: "🪟 Time to close the windows"
      message: >-
        {% if trigger.id == 'warm' %}It's warmer outside ({{ states(outdoor) }} °C) than inside ({{ states(indoor) }} °C) — close them to keep the heat out.{% else %}It's colder outside ({{ states(outdoor) }} °C) than inside ({{ states(indoor) }} °C) — close them to keep the warmth in.{% endif %}
      data: { tag: close-windows }
