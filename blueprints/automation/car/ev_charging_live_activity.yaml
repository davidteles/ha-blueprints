blueprint:
  name: EV charging Live Activity — plugged in, charging, charged
  description: >-
    **Needs an iPhone with Live Activities turned on** (iOS 17.2 or later, Home
    Assistant app 2026.x): on the iPhone, Settings → Home Assistant → Live
    Activities, and in the Home Assistant app, Settings → Live Activities
    (accept the one-time notice). Without that, nothing is shown.


    A Live Activity on the iPhone's lock screen and Dynamic Island for your
    electric car:


    **🔌 Plugged in** — "Waiting to charge · 63% → 80%" →
    **⚡ Charging** — "1 h 20 min left · 80% at 23:40 · 7 kW · 300 km" (the
    car's own remaining-time estimate, counted down between car updates;
    "Charging to 80%" when the car gives none), with the battery as a progress
    bar towards the charge limit → **✅ Charged** (alerts once, silently at
    night). Everything closes by itself when the cable is unplugged
    — straight away if your wall charger reports it (car sensors can lag for
    hours after unplugging).
    If charging stops before the limit, it goes back to "plugged in".
    With a wall charger status, charging at home starts the card as soon as the
    charger starts (car data can arrive minutes later), and unplugging never
    flashes a short "plugged in" card while the car's sensors catch up.


    Each phase is its own Live Activity, so a long wait for cheap hours can't hit
    the 8-hour iOS limit. Works with any car integration that has a charging
    state and a battery level.


    **Create first:** a **Text helper** (max 20 characters) for this blueprint
    to remember the phase, e.g. "Car live phase".
  domain: automation
  source_url: https://github.com/davidteles/ha-blueprints/blob/main/blueprints/automation/car/ev_charging_live_activity.yaml
  input:
    charging_state:
      name: Charging state
      description: A sensor (or binary sensor) that says whether the car is charging.
      selector: { entity: { domain: [sensor, binary_sensor] } }
    charging_values:
      name: '"Charging" values'
      description: Value(s) of that entity meaning "charging now", separated by commas.
      default: charging, on
      selector: { text: {} }
    plugged_values:
      name: '"Plugged in but not charging" values'
      description: Used when you have no plug sensor below. Separated by commas.
      default: ready_for_charging, conserving, charging_interrupted, connected, plugged_in, paused, complete
      selector: { text: {} }
    not_plugged_values:
      name: '"Cable not connected" values'
      description: >-
        Values of the charging state that mean no cable, separated by commas.
        Many cars report this a few seconds before their "cable connected"
        sensor turns off; without it a short "plugged in" card appeared right
        after unplugging.
      default: connect_cable, disconnected, unplugged, not_connected, no_cable
      selector: { text: {} }
    remaining_time:
      name: Remaining charging time (optional, recommended)
      description: >-
        The car's "time to full / remaining charging time" sensor (minutes or
        hours). Shown on the charging card instead of repeating the percentage.
      default: []
      selector: { entity: { domain: sensor } }
    plug:
      name: Cable connected sensor (optional, recommended)
      default: []
      selector: { entity: { domain: binary_sensor } }
    charger_status:
      name: Wall charger status (optional)
      description: >-
        Your charger's status sensor (e.g. Wallbox "Status description"). When
        it says no car is connected, the card closes at once.
      default: []
      selector: { entity: { domain: sensor } }
    charger_empty_values:
      name: '"No car connected" charger values'
      description: Separated by commas. Upper/lower case doesn't matter.
      default: Ready, Locked, available, disconnected, not_connected
      selector: { text: {} }
    charger_car_values:
      name: '"Car connected" charger values'
      description: >-
        Charger states that mean a car is connected (so the card starts at once,
        before the car reports). Separated by commas.
      default: Charging, Paused, Scheduled, Waiting for car demand, Waiting, Locked, car connected, connected, charging, suspended_ev, suspended_evse
      selector: { text: {} }
    charger_charging_values:
      name: '"Charging" charger values'
      default: Charging, charging
      selector: { text: {} }
    charger_done_values:
      name: '"Car is full" charger values'
      description: After charging, these mean the car stopped asking for power (shown as charged).
      default: Waiting for car demand, suspended_ev, finished, complete
      selector: { text: {} }
    car_location:
      name: Car location (optional)
      description: >-
        The car's device tracker. When set, the charger status only counts
        while the car is at home, so charging elsewhere still shows.
      default: []
      selector: { entity: { domain: [device_tracker, person] } }
    battery:
      name: Battery level
      selector: { entity: { domain: sensor, device_class: battery } }
    limit:
      name: Charge limit (optional)
      description: A sensor or number with the target %. Without it, 100 % is used.
      default: []
      selector: { entity: { domain: [sensor, number] } }
    power:
      name: Charging power, kW (optional)
      description: From the car or the wall charger.
      default: []
      selector: { entity: { domain: sensor } }
    range:
      name: Range (optional)
      default: []
      selector: { entity: { domain: sensor } }
    phase_helper:
      name: Phase helper (Text)
      selector: { entity: { domain: input_text } }
    name:
      name: Car name
      default: Car
      selector: { text: {} }
    url:
      name: Open when tapped (optional)
      description: A dashboard path such as /lovelace/car.
      default: ""
      selector: { text: {} }
    quiet_start:
      name: Quiet from
      description: The "charged" alert arrives silently between these times.
      default: "23:00:00"
      selector: { time: {} }
    quiet_end:
      name: Quiet until
      default: "08:00:00"
      selector: { time: {} }
    hide_switch:
      name: '"Hide until done" switch (optional)'
      description: >-
        A toggle helper (input_boolean) with a button on the page the card
        opens. Turning it on closes the card on this phone and stops its
        updates; when the job finishes you get one normal notification
        instead, and the switch turns itself off when the job is over. For a
        per-phone choice, make one automation per phone, each with its own
        notification action, phase helper and switch.
      default: []
      selector: { entity: { domain: input_boolean } }
    notify_action:
      name: Notification action
      description: e.g. notify.mobile_app_your_phone.
      default: notify.notify
      selector: { text: {} }

mode: queued
max: 10

variables: &live_vars
  state_entity: !input charging_state
  plug_entity: !input plug
  charger_entity: !input charger_status
  location_entity: !input car_location
  empty_input: !input charger_empty_values
  empty_list: "{{ empty_input.split(',') | map('trim') | map('lower') | reject('eq', '') | list }}"
  charger_empty: >-
    {{ charger_entity not in ['', none, []] and states(charger_entity) | lower in empty_list
       and (location_entity in ['', none, []] or is_state(location_entity, 'home')) }}
  car_input: !input charger_car_values
  car_list: "{{ car_input.split(',') | map('trim') | map('lower') | reject('eq', '') | list }}"
  chg_input: !input charger_charging_values
  chg_list: "{{ chg_input.split(',') | map('trim') | map('lower') | reject('eq', '') | list }}"
  done_input: !input charger_done_values
  done_list: "{{ done_input.split(',') | map('trim') | map('lower') | reject('eq', '') | list }}"
  charger_here: >-
    {{ charger_entity not in ['', none, []]
       and (location_entity in ['', none, []] or not is_state(location_entity, 'not_home')) }}
  charger_state: "{{ states(charger_entity) | lower if charger_entity not in ['', none, []] else '' }}"
  charger_car: "{{ charger_here and charger_state in car_list }}"
  charger_charging: "{{ charger_car and charger_state in chg_list }}"
  charger_done: "{{ charger_car and charger_state in done_list }}"
  not_plugged_input: !input not_plugged_values
  not_plugged_list: "{{ not_plugged_input.split(',') | map('trim') | map('lower') | reject('eq', '') | list }}"
  remaining_entity: !input remaining_time
  left: >-
    {%- set m = 0 -%}
    {%- if remaining_entity not in ['', none, []] -%}
    {%- set v = states(remaining_entity) | float(0) -%}
    {%- set u = (state_attr(remaining_entity, 'unit_of_measurement') or 'min') | lower -%}
    {%- set m = v * 60 if u in ['h', 'hr', 'hours'] else (v / 60 if u in ['s', 'sec'] else v) -%}
    {%- endif -%}
    {%- set st = states[remaining_entity] if remaining_entity not in ['', none, []] else none -%}
    {%- if m > 0 and st is not none -%}{{ [((st.last_reported + timedelta(minutes=m) - now()).total_seconds() / 60) | round(0) | int, 1] | max }}{%- else -%}0{%- endif -%}
  battery_entity: !input battery
  limit_entity: !input limit
  power_entity: !input power
  range_entity: !input range
  phase_entity: !input phase_helper
  name: !input name
  url: !input url
  notify_action: !input notify_action
  hide_entity: !input hide_switch
  hidden: "{{ hide_entity not in ['', none, []] and is_state(hide_entity, 'on') }}"
  quiet_start: !input quiet_start
  quiet_end: !input quiet_end
  charging_input: !input charging_values
  plugged_input: !input plugged_values
  charging_list: "{{ charging_input.split(',') | map('trim') | map('lower') | reject('eq', '') | list }}"
  plugged_list: "{{ plugged_input.split(',') | map('trim') | map('lower') | reject('eq', '') | list }}"
  cs: "{{ states(state_entity) | lower }}"
  charging: "{{ cs in charging_list or charger_charging }}"
  plugged: >-
    {% set b = states(plug_entity) if plug_entity not in ['', none, []] else 'none' %}
    {% if charger_car %}{{ true }}
    {% elif charger_empty or cs in not_plugged_list %}{{ false }}
    {% else %}{{ charging or (b == 'on' if b in ['on', 'off'] else cs in plugged_list) }}{% endif %}
  soc: "{{ states(battery_entity) | float(0) | round(0) | int }}"
  target: "{{ (states(limit_entity) | float(100) | round(0) | int) if limit_entity not in ['', none, []] else 100 }}"
  kw_raw: "{{ (states(power_entity) | float(0) | round(1)) if power_entity not in ['', none, []] else 0 }}"
  kw: "{{ (kw_raw | round(0) | int) if kw_raw >= 20 else kw_raw }}"
  km: "{{ (states(range_entity) | float(0) | round(0) | int) if range_entity not in ['', none, []] else 0 }}"
  km_unit: "{{ (state_attr(range_entity, 'unit_of_measurement') or 'km') if range_entity not in ['', none, []] else '' }}"
  prev: "{{ states(phase_entity) }}"
  phase: >-
    {% if not plugged %}none
    {% elif charging %}charging
    {% elif prev in ['charging', 'charged'] and (soc >= target - 1 or cs == 'conserving' or charger_done) %}charged
    {% else %}waiting{% endif %}
  tag_base: "{{ 'live_' ~ (name | lower | regex_replace('[^a-z0-9]+', '_')) }}"
  tags:
    waiting: "{{ tag_base }}_plugged"
    charging: "{{ tag_base }}_charging"
    charged: "{{ tag_base }}_charged"
  quiet: >-
    {% set t = now().strftime('%H:%M:%S') %}
    {{ (t >= quiet_start or t < quiet_end) if quiet_start > quiet_end else (quiet_start <= t < quiet_end) }}

triggers:
  - trigger: state
    entity_id: !input charging_state
    not_to: [unknown, unavailable]
    not_from: [unknown, unavailable]
  - alias: Cable plugged / unplugged (1 min, so short 'unknown' flaps are ignored)
    trigger: state
    entity_id: !input plug
    to: ["on", "off"]
    not_from: [unknown, unavailable]
    for: { minutes: 1 }
  - alias: The wall charger says the car is gone
    trigger: state
    entity_id: !input charger_status
    not_to: [unknown, unavailable]
    not_from: [unknown, unavailable]
  - trigger: state
    entity_id: !input battery
    not_to: [unknown, unavailable]
    not_from: [unknown, unavailable]
  - trigger: state
    entity_id: !input limit
    not_to: [unknown, unavailable]
    not_from: [unknown, unavailable]
  - trigger: state
    entity_id: !input power
    not_to: [unknown, unavailable]
    not_from: [unknown, unavailable]
  - trigger: state
    entity_id: !input remaining_time
    not_to: [unknown, unavailable]
    not_from: [unknown, unavailable]
  - alias: Refresh the countdown every 10 min
    trigger: time_pattern
    minutes: /10
  - alias: '"Hide until done" switched on'
    trigger: state
    entity_id: !input hide_switch
    to: "on"
    id: hide

actions:
  - alias: >-
      Read everything again now. Queued runs would otherwise use the state from
      when they were triggered, and several sensors changing in the same second
      each started their own card (duplicates on the phone).
    variables: *live_vars
  - alias: '"Hide until done" switched on → close the card on this phone now'
    if:
      - condition: template
        value_template: "{{ trigger.id == 'hide' }}"
    then:
      - repeat:
          for_each: "{{ tags.values() | list }}"
          sequence:
            - action: "{{ notify_action }}"
              continue_on_error: true
              data:
                message: clear_notification
                data: { tag: "{{ repeat.item }}" }
      - stop: Card hidden on this phone
  - alias: Phase changed → close the previous Live Activity
    if:
      - condition: template
        value_template: "{{ phase != prev and prev in tags }}"
    then:
      - action: "{{ notify_action }}"
        continue_on_error: true
        data:
          message: clear_notification
          data: { tag: "{{ tags[prev] }}" }
  - alias: Show the card (skipped while "hide until done" is on)
    if:
      - condition: template
        value_template: "{{ not hidden }}"
    then:
      - alias: Show the current phase
        if:
          - condition: template
            value_template: "{{ phase in tags }}"
        then:
          - variables:
              range_text: "{{ (km ~ ' ' ~ km_unit) if km > 0 else '' }}"
          - action: "{{ notify_action }}"
            data:
              title: >-
                {{ {'waiting': '🔌 ' ~ name ~ ' plugged in', 'charging': '⚡ ' ~ name ~ ' charging', 'charged': '✅ ' ~ name ~ ' charged'}[phase] }}
              message: >-
                {% if phase == 'waiting' %}{{ ('Already at ' ~ soc ~ '%') if soc >= target - 1 else ('Waiting to charge · ' ~ soc ~ '% → ' ~ target ~ '%') }}{{ (' · ' ~ range_text) if range_text else '' }}
                {%- elif phase == 'charging' %}{% if left > 0 %}{{ (left ~ ' min') if left < 60 else ((left // 60) ~ ' h ' ~ '%02d' % (left % 60) ~ ' min') }} left · {{ target }}% at {{ (now() + timedelta(minutes=left)).strftime('%H:%M') }}{% else %}Charging to {{ target }}%{% endif %}{{ (' · ' ~ kw ~ ' kW') if kw > 0 else '' }}{{ (' · ' ~ range_text) if range_text else '' }}
                {%- else %}{{ soc }}%{{ (' · ' ~ range_text) if range_text else '' }} · unplug when you go{% endif %}
              data:
                tag: "{{ tags[phase] }}"
                live_update: true
                silent: "{{ phase != 'charged' or phase == prev or quiet }}"
                progress: "{{ soc }}"
                progress_max: "{{ [target, soc, 1] | max }}"
                critical_text: "{{ soc }}%"
                notification_icon: "{{ 'mdi:ev-plug-type2' if phase == 'waiting' else 'mdi:car-electric' }}"
                notification_icon_color: "{{ '#FF9800' if phase == 'waiting' else '#4CAF50' }}"
                progress_bar_color: "{{ '#FF9800' if phase == 'waiting' else '#4CAF50' }}"
                url: "{{ url }}"
    else:
      - alias: Hidden on this phone → one normal notification when it finishes
        if:
          - condition: template
            value_template: "{{ phase == 'charged' and prev != 'charged' }}"
        then:
          - action: "{{ notify_action }}"
            continue_on_error: true
            data:
              title: "✅ {{ name }} charged"
              message: "{{ soc }}%{{ (' · ' ~ km ~ ' ' ~ km_unit) if km > 0 else '' }} · unplug when you go"
              data: { tag: "{{ tag_base }}_hidden_done", url: "{{ url }}" }
      - alias: The job is over → show cards again next time
        if:
          - condition: template
            value_template: "{{ phase == 'none' }}"
        then:
          - action: input_boolean.turn_off
            target: { entity_id: "{{ hide_entity }}" }
  - alias: Remember the phase
    if:
      - condition: template
        value_template: "{{ phase != prev }}"
    then:
      - action: input_text.set_value
        target: { entity_id: "{{ phase_entity }}" }
        data: { value: "{{ phase }}" }
  - alias: >-
      A new card was just started: give the phone 15 s to register it before the
      next update, or iOS starts a second card for the same tag
    if:
      - condition: template
        value_template: "{{ phase != prev and phase in tags }}"
    then:
      - delay: { seconds: 15 }
