blueprint:
  name: Alert that clears itself
  description: >-
    When a problem sensor stays on for a while (water tank full, filter, leak,
    door left open…), send a phone notification. When it turns off again, the
    notification disappears from the phone by itself. Uses the Home Assistant
    Companion app's tag and clear_notification.
  domain: automation
  source_url: https://github.com/davidteles/ha-blueprints/blob/main/blueprints/automation/self_clearing_alert.yaml
  input:
    problem:
      name: Problem sensor
      selector: { entity: { domain: binary_sensor } }
    delay:
      name: Wait before alerting
      description: Avoids alerts while someone is already dealing with it (e.g. emptying a tank).
      default: { minutes: 2 }
      selector: { duration: {} }
    notify_device:
      name: Phone
      selector: { device: { integration: mobile_app } }
    title:
      name: Title
      default: "⚠️ Needs attention"
      selector: { text: {} }
    message:
      name: Message
      default: "Something needs attention."
      selector: { text: { multiline: true } }
    tag:
      name: Notification tag
      description: Unique per alert, so it replaces and clears the right notification.
      default: problem-alert
      selector: { text: {} }
triggers:
  - trigger: state
    entity_id: !input problem
    to: "on"
    for: !input delay
    id: problem
  - trigger: state
    entity_id: !input problem
    from: "on"
    to: "off"
    id: cleared
variables:
  tag: !input tag
actions:
  - choose:
      - conditions: [{ condition: trigger, id: problem }]
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            title: !input title
            message: !input message
            data: { tag: "{{ tag }}" }
      - conditions: [{ condition: trigger, id: cleared }]
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            message: clear_notification
            data: { tag: "{{ tag }}" }
mode: queued
