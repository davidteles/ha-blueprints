blueprint:
  name: Leaving check — anything left open or on?
  description: >-
    When the last person leaves home, one notification lists anything left open
    or on: doors and windows (found automatically, new sensors included),
    garage doors and lights. With a **Turn off all lights** button. Nothing is
    sent when everything is closed and off.


    Garage doors are listed but deliberately *not* closable from here.


    Optional **Guest at home** switch: while it is on, nothing is sent (someone
    is still in the house).
  domain: automation
  source_url: https://github.com/davidteles/ha-blueprints/blob/main/blueprints/automation/presence/leaving_check.yaml
  input:
    home_zone:
      name: Home zone
      default: zone.home
      selector: { entity: { domain: zone } }
    covers:
      name: Garage doors / gates to check
      default: []
      selector: { entity: { domain: cover, multiple: true } }
    ignore:
      name: Ignore these
      description: Sensors or lights that are fine to leave on/open (fridge door, a relay that powers other lamps…).
      default: []
      selector: { entity: { multiple: true } }
    ignore_label:
      name: Ignore everything with this label
      description: >-
        The easy way: create a label such as "Ignore" (Settings → Areas, labels
        & zones → Labels) and put it on any entity or whole device you never
        want listed — a car's window sensors, a fridge door, a lamp relay.
      default: ""
      selector: { label: {} }
    skip_climate_devices:
      name: Skip door/window sensors on a device that has a climate entity
      description: >-
        The exact rule: a door, window or opening sensor is left out when its
        device also has a climate.* entity. That catches a thermostat's or
        radiator valve's guessed "open window" (tado, Netatmo…) and a car's doors
        when the car has a climate entity. It does NOT catch a car without one
        (use the ignore label), and it DOES hide a real contact sensor that sits
        on a device with a thermostat: put those in "Always list these". Turn
        off to list every sensor.
      default: true
      selector: { boolean: {} }
    always_list:
      name: Always list these
      description: >-
        Door/window sensors that are listed even if the rule above would skip
        them, e.g. a real window contact wired into a thermostat or hub that also
        has a climate entity. "Ignore these" and the ignore label still win.
      default: []
      selector: { entity: { domain: binary_sensor, multiple: true } }
    check_lights:
      name: List lights that are on
      default: true
      selector: { boolean: {} }
    guest_switch:
      name: Guest at home switch (optional)
      description: >-
        A toggle (e.g. an input_boolean "Guest at home") that is on while someone
        stays in the house without you. While it is on, leaving sends nothing.
      default: []
      selector: { entity: { domain: [input_boolean, switch, binary_sensor] } }
    notify_action:
      name: Notification action
      default: notify.notify
      selector: { text: {} }

mode: queued

variables:
  covers: !input covers
  ignore_input: !input ignore
  ignore_label: !input ignore_label
  ignore: >-
    {% set by_label = (label_entities(ignore_label) + (label_devices(ignore_label) | map('device_entities') | sum(start=[]))) if ignore_label else [] %}
    {{ (ignore_input + by_label) | unique | list }}
  check_lights: !input check_lights
  skip_climate_devices: !input skip_climate_devices
  always_list: !input always_list
  notify_action: !input notify_action
  guest_switch: !input guest_switch
  guest_home: "{{ guest_switch not in ['', none, []] and is_state(guest_switch, 'on') }}"
  climate_device_sensors: >-
    {% set ns = namespace(e=[]) %}
    {% if skip_climate_devices %}
    {% for s in states.binary_sensor | selectattr('attributes.device_class', 'defined')
         | selectattr('attributes.device_class', 'in', ['door', 'window', 'garage_door', 'opening']) %}
    {% set dev = device_id(s.entity_id) %}
    {% if s.entity_id not in always_list and dev and device_entities(dev) | select('match', 'climate\\.') | list | count > 0 %}{% set ns.e = ns.e + [s.entity_id] %}{% endif %}
    {% endfor %}
    {% endif %}{{ ns.e }}
  openings: >-
    {{ states.binary_sensor | selectattr('attributes.device_class', 'defined')
       | selectattr('attributes.device_class', 'in', ['door', 'window', 'garage_door', 'opening'])
       | selectattr('state', 'eq', 'on') | rejectattr('entity_id', 'in', ignore)
       | rejectattr('entity_id', 'in', climate_device_sensors)
       | map(attribute='name') | list }}
  open_covers: >-
    {{ covers | select('is_state', ['open', 'opening']) | reject('in', ignore)
       | map('state_attr', 'friendly_name') | list }}
  lights_on: >-
    {{ (states.light | selectattr('state', 'eq', 'on') | rejectattr('attributes.entity_id', 'defined')
       | map(attribute='entity_id') | reject('in', ignore) | list) if check_lights else [] }}
  items: >-
    {{ openings + open_covers
       + (lights_on | map('state_attr', 'friendly_name') | map('regex_replace', '^', '💡 ') | list) }}

triggers:
  - trigger: numeric_state
    entity_id: !input home_zone
    below: 1
    # A phone app reload makes its person 'unknown' for a split second, which
    # empties the zone briefly; only count it once nobody has been home for 1 min.
    for: { minutes: 1 }
    id: left
  - trigger: event
    event_type: mobile_app_notification_action
    event_data: { action: LEAVING_LIGHTS_OFF }
    id: lights_off

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: left
          - alias: No guest at home
            condition: template
            value_template: "{{ not guest_home }}"
          - condition: template
            value_template: "{{ items | count > 0 }}"
        sequence:
          - action: "{{ notify_action }}"
            data:
              title: "🏠 Left on / open at home"
              message: "{{ items | join(', ') }}{{ '\n👆 Press and hold for: Turn off all lights' if lights_on | count > 0 else '' }}"
              data:
                tag: leaving-check
                actions: >-
                  {{ [{'action': 'LEAVING_LIGHTS_OFF', 'title': 'Turn off all lights'}] if lights_on | count > 0 else [] }}
      - conditions: [{ condition: trigger, id: lights_off }]
        sequence:
          - variables:
              to_turn_off: "{{ states.light | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | reject('in', ignore) | list }}"
          - if:
              - condition: template
                value_template: "{{ to_turn_off | count > 0 }}"
            then:
              - action: light.turn_off
                target: { entity_id: "{{ to_turn_off }}" }
          - action: "{{ notify_action }}"
            continue_on_error: true
            data:
              message: clear_notification
              data: { tag: leaving-check }
