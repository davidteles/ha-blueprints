blueprint:
  name: Leaving check — anything left open or on?
  description: >-
    When the last person leaves home, one notification lists anything left open
    or on: doors and windows (found automatically, new sensors included),
    garage doors and lights. With a **Turn off all lights** button. Nothing is
    sent when everything is closed and off.


    Garage doors are listed but deliberately *not* closable from here.
  domain: automation
  source_url: https://github.com/davidteles/ha-blueprints/blob/main/blueprints/automation/presence/leaving_check.yaml
  input:
    home_zone:
      name: Home zone
      default: zone.home
      selector: { entity: { domain: zone } }
    covers:
      name: Garage doors / gates to check
      default: []
      selector: { entity: { domain: cover, multiple: true } }
    ignore:
      name: Ignore these
      description: Sensors or lights that are fine to leave on/open (fridge door, a relay that powers other lamps…).
      default: []
      selector: { entity: { multiple: true } }
    ignore_label:
      name: Ignore everything with this label
      description: >-
        The easy way: create a label such as "Ignore" (Settings → Areas, labels
        & zones → Labels) and put it on any entity or whole device you never
        want listed — a car's window sensors, a fridge door, a lamp relay.
      default: ""
      selector: { label: {} }
    check_lights:
      name: List lights that are on
      default: true
      selector: { boolean: {} }
    notify_action:
      name: Notification action
      default: notify.notify
      selector: { text: {} }

mode: queued

variables:
  covers: !input covers
  ignore_input: !input ignore
  ignore_label: !input ignore_label
  ignore: >-
    {% set by_label = (label_entities(ignore_label) + (label_devices(ignore_label) | map('device_entities') | sum(start=[]))) if ignore_label else [] %}
    {{ (ignore_input + by_label) | unique | list }}
  check_lights: !input check_lights
  notify_action: !input notify_action
  openings: >-
    {{ states.binary_sensor | selectattr('attributes.device_class', 'defined')
       | selectattr('attributes.device_class', 'in', ['door', 'window', 'garage_door', 'opening'])
       | selectattr('state', 'eq', 'on') | rejectattr('entity_id', 'in', ignore)
       | map(attribute='name') | list }}
  open_covers: >-
    {{ covers | select('is_state', ['open', 'opening']) | reject('in', ignore)
       | map('state_attr', 'friendly_name') | list }}
  lights_on: >-
    {{ (states.light | selectattr('state', 'eq', 'on') | rejectattr('attributes.entity_id', 'defined')
       | map(attribute='entity_id') | reject('in', ignore) | list) if check_lights else [] }}
  items: >-
    {{ openings + open_covers
       + (lights_on | map('state_attr', 'friendly_name') | map('regex_replace', '^', '💡 ') | list) }}

triggers:
  - trigger: numeric_state
    entity_id: !input home_zone
    below: 1
    # A phone app reload makes its person 'unknown' for a split second, which
    # empties the zone briefly; only count it once nobody has been home for 1 min.
    for: { minutes: 1 }
    id: left
  - trigger: event
    event_type: mobile_app_notification_action
    event_data: { action: LEAVING_LIGHTS_OFF }
    id: lights_off

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: left
          - condition: template
            value_template: "{{ items | count > 0 }}"
        sequence:
          - action: "{{ notify_action }}"
            data:
              title: "🏠 Left on / open at home"
              message: "{{ items | join(', ') }}{{ '\n👆 Press and hold for: Turn off all lights' if lights_on | count > 0 else '' }}"
              data:
                tag: leaving-check
                actions: >-
                  {{ [{'action': 'LEAVING_LIGHTS_OFF', 'title': 'Turn off all lights'}] if lights_on | count > 0 else [] }}
      - conditions: [{ condition: trigger, id: lights_off }]
        sequence:
          - variables:
              to_turn_off: "{{ states.light | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | reject('in', ignore) | list }}"
          - if:
              - condition: template
                value_template: "{{ to_turn_off | count > 0 }}"
            then:
              - action: light.turn_off
                target: { entity_id: "{{ to_turn_off }}" }
          - action: "{{ notify_action }}"
            continue_on_error: true
            data:
              message: clear_notification
              data: { tag: leaving-check }
